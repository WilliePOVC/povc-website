name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Production build for the custom domain www.presson.vc (served at root).
      # PAGES=false drops the /povc-website basePath so assets resolve from /.
      # The public/CNAME file tells GitHub Pages to serve the custom domain.
      # (To revert to the project-page URL williepovc.github.io/povc-website,
      #  set PAGES: "true" and NEXT_PUBLIC_BASE_PATH: "/povc-website".)
      - name: Build
        run: npm run build
        env:
          PAGES: "false"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
