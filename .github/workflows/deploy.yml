name: Deploy to GitHub Pages

# presson.vc is a static export, so dynamic content (Notion press, Medium blog,
# YouTube podcast) is pulled at build time. Rebuild triggers:
#   • push to main
#   • daily: rebuild so new podcast episodes + Notion/Medium edits go live
#   • manual: Actions → Deploy to GitHub Pages → Run workflow (e.g. right after publishing)

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 14 * * *"  # daily full rebuild (7:15am PT)
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCBZ2His5V_nTxXtBc4cxeUA' }}
  YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "15 14 * * *" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PL="${YOUTUBE_PLAYLIST_ID:-UULF${YOUTUBE_CHANNEL_ID#UC}}"
          FEED=$(curl -fsSL "https://www.youtube.com/feeds/videos.xml?playlist_id=$PL" || true)
          if [ -z "$FEED" ]; then echo "Feed unreachable; skipping"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          NEW=$(echo "$FEED" | grep -E '<yt:videoId>|<title>|<updated>' | sha256sum | cut -c1-16)
          LIVE=$(curl -fsSL "https://www.presson.vc/podcast-feed.sha" || echo none)
          echo "feed=$NEW live=$LIVE"
          if [ "$NEW" != "$LIVE" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "build=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Production build for the custom domain www.presson.vc (served at root).
      # PAGES=false drops the /povc-website basePath so assets resolve from /.
      # The public/CNAME file tells GitHub Pages to serve the custom domain.
      # (To revert to the project-page URL williepovc.github.io/povc-website,
      #  set PAGES: "true" and NEXT_PUBLIC_BASE_PATH: "/povc-website".)
      - name: Build
        run: npm run build
        env:
          PAGES: "false"
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # Fingerprint of the feed this build used, so the hourly check can skip no-op rebuilds.
      - name: Write podcast feed fingerprint
        run: |
          PL="${YOUTUBE_PLAYLIST_ID:-UULF${YOUTUBE_CHANNEL_ID#UC}}"
          curl -fsSL "https://www.youtube.com/feeds/videos.xml?playlist_id=$PL" \
            | grep -E '<yt:videoId>|<title>|<updated>' | sha256sum | cut -c1-16 > out/podcast-feed.sha || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
